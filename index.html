    <!-- Lenis Smooth Scroll Engine -->

    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      if (window.location.hash && window.location.hash !== "#home") {
        history.replaceState(null, "", window.location.pathname + "#home");
      }
      window.scrollTo(0, 0);
